<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridget Fayomi — Product Designer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .intro {
            text-align: center;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 400;
            margin-bottom: 12px;
        }

        p {
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .loading {
            width: 180px;
            height: 2px;
            background: #333;
            margin: 35px auto 0;
            overflow: hidden;
        }

        .loading-bar {
            width: 0;
            height: 100%;
            background: #c4f02a;
            animation: loading 3.5s ease forwards;
        }

        @keyframes loading {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="intro">
        <h1>Bridget Fayomi</h1>
        <p>Product Designer</p>

        <div class="loading">
            <div class="loading-bar"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.body.style.opacity = '0';

            setTimeout(() => {
                window.location.href = 'portfolio.html';
            }, 600);

        }, 3500);
    </script>

</body>
</html>
